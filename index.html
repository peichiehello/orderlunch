            orders: {}

        let currentDate = toDateStr(new Date()); // YYYY-MM-DD

        function toDateStr(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('localStorage 無法使用（可能在預覽環境），資料僅存於本次工作階段。', e);
            }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.people) state.people = parsed.people;
                    if (parsed.orders) state.orders = parsed.orders;
                }
            } catch (e) {
                console.warn('讀取 localStorage 失敗', e);
            }
        }

        function getTodayOrders() {
            if (!state.orders[currentDate]) state.orders[currentDate] = [];
            return state.orders[currentDate];
        }

        function isHoliday(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            const wd = d.getDay(); // 0=日 6=六
            if (wd === 0 || wd === 6) return { holiday: true, name: '週末' };
            const md = dateStr.slice(5);
            if (TW_HOLIDAYS_2026[md]) return { holiday: true, name: TW_HOLIDAYS_2026[md] };
            return { holiday: false, name: '' };
        }

            <div class="flex justify-end gap-3">

                <button onclick="confirmSwitch()" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded text-white font-bold">確定清空並切換</button>
            </div>
        </div>
    </div>

    <div id="summary-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 px-4 py-10">
        <div class="bg-white rounded-xl w-full max-w-3xl max-h-full flex flex-col shadow-2xl">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-indigo-50 rounded-t-xl">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">日結會計表</h2>
                    <p class="text-sm text-indigo-600 font-medium mt-1"><span id="summary-restaurant-name"></span> ｜ <span id="summary-date"></span></p>
                </div>
                <button onclick="closeSummaryModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="flex border-b border-gray-200">
                <button id="tab-btn-item" onclick="switchSummaryTab('item')" class="flex-1 py-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 transition-colors">依餐點統計</button>
                <button id="tab-btn-person" onclick="switchSummaryTab('person')" class="flex-1 py-3 text-center font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-colors">依人員結帳</button>
            </div>
            <div id="summary-content" class="p-5 flex-grow overflow-y-auto"></div>
            <div class="p-5 border-t border-gray-200 bg-white rounded-b-xl flex justify-between items-center flex-wrap gap-3">
                <div class="text-lg font-bold text-gray-800">本日總計: <span class="text-indigo-600 text-2xl" id="summary-total-price">$0</span></div>
                <div class="flex gap-2">
                    <button onclick="exportDayCSV()" class="px-4 py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold shadow flex items-center gap-2 transition-colors text-sm">
                        匯出本日 (CSV)
                    </button>
                    <button onclick="copySummary()" class="px-4 py-2.5 bg-green-500 hover:bg-green-600 text-white rounded-lg font-bold shadow flex items-center gap-2 transition-colors text-sm">
                        複製明細
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pendingRestaurantSwitch = null;
        let currentSummaryView = 'item';
        let currentSummaryText = '';

        function calculatePayment(personName, total) {
            if (personName === '總經理') return { selfPay: 0, companyPays: total }; // 總經理全額補助無上限
            if (personName === '琇如') return { selfPay: total, companyPays: 0 };    // 琇如全額自付
            const companyPays = Math.min(total, MAX_SUBSIDY);
            return { selfPay: total - companyPays, companyPays };
        }

        function refreshPeopleSelect() {
            const sel = document.getElementById('global-person');
            const prev = sel.value;
            let html = '<option value="" disabled selected>請選擇點單人</option>';
            state.people.forEach(p => html += `<option value="${p}">${p}</option>`);
            sel.innerHTML = html;
            if (state.people.includes(prev)) sel.value = prev;
        }

        function showToastMsg(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerHTML = isSuccess ? '✅' : '⚠️';
            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 2500);
        }

        /* ---- 日期 ---- */
        function onDateChange() {
            currentDate = document.getElementById('work-date').value;
            renderDateBadge();
            renderMenu();
            updateTotal();
        }

        function renderDateBadge() {
            const badge = document.getElementById('date-badge');
            const banner = document.getElementById('holiday-banner');
            const info = isHoliday(currentDate);
            const wdMap = ['日','一','二','三','四','五','六'];
            const d = new Date(currentDate + 'T00:00:00');
            const wd = wdMap[d.getDay()];
            if (info.holiday) {
                badge.innerHTML = `<span class="px-2 py-0.5 bg-red-100 text-red-700 rounded font-bold">週${wd}・${info.name}（放假）</span>`;
                banner.classList.remove('hidden');
                banner.innerHTML = `⚠️ ${currentDate}（週${wd}）為<b>${info.name}</b>，見紅就休。此日通常不點餐，若仍要點餐可照常操作。`;
            } else {
                badge.innerHTML = `<span class="px-2 py-0.5 bg-green-100 text-green-700 rounded font-bold">週${wd}・上班日</span>`;
                banner.classList.add('hidden');
            }
            document.getElementById('footer-date').innerText = currentDate;
        }

        /* ---- 餐廳 tabs ---- */
        function initTabs() {
            const tabsContainer = document.getElementById('restaurant-tabs');
            let html = '';
            Object.keys(restaurantsData).forEach(name => {
                const isActive = name === currentRestaurant;
                html += `<button onclick="requestSwitchRestaurant('${name}')" class="px-6 py-4 whitespace-nowrap font-bold text-sm transition-colors border-b-2 focus:outline-none ${isActive ? 'text-indigo-600 border-indigo-600 bg-white' : 'text-gray-500 border-transparent hover:text-gray-700 hover:bg-indigo-100/50'}">${name}</button>`;
            });
            tabsContainer.innerHTML = html;
            refreshPeopleSelect();
        }

        function requestSwitchRestaurant(newRes) {
            if (newRes === currentRestaurant) return;
            const todays = getTodayOrders();
            if (todays.length > 0) {
                pendingRestaurantSwitch = newRes;
                document.getElementById('confirm-count').innerText = todays.length;
                document.getElementById('confirm-modal').classList.remove('hidden');
                document.getElementById('confirm-modal').classList.add('flex');
            } else {
                executeSwitch(newRes);
            }
        }
        function cancelSwitch() {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('confirm-modal').classList.remove('flex');
            pendingRestaurantSwitch = null;
        }
        function confirmSwitch() {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('confirm-modal').classList.remove('flex');
            state.orders[currentDate] = [];
            saveState();
            updateTotal();
            executeSwitch(pendingRestaurantSwitch);
            pendingRestaurantSwitch = null;
        }
        function executeSwitch(newRes) {
            currentRestaurant = newRes;
            initTabs();
            renderMenu();
        }

        /* ---- 菜單渲染 ---- */
        function renderMenu() {
            const container = document.getElementById('menu-container');
            const data = restaurantsData[currentRestaurant];
            let html = '';
            data.forEach((cat, catIdx) => {
                html += `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <h2 class="bg-gray-50 px-5 py-3 text-lg font-bold text-gray-800 border-b border-gray-100 flex items-center gap-2">
                        <span class="w-1.5 h-5 bg-indigo-500 rounded-full block"></span>${cat.category}
                    </h2><div class="divide-y divide-gray-100">`;
                cat.items.forEach((item, itemIdx) => {
                    const uk = `${catIdx}-${itemIdx}`;
                    html += `<div class="p-5 hover:bg-gray-50/50 transition-colors">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div class="flex-grow">
                                <h3 class="text-lg font-bold text-gray-800">${item.name}</h3>
                                ${item.desc ? `<p class="text-sm text-gray-500 mt-0.5">${item.desc}</p>` : ''}
                                <div class="text-indigo-600 font-bold mt-1 text-lg">$${item.price}</div>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto shrink-0 mt-2 sm:mt-0">
                                <button onclick="addOrder('${catIdx}','${itemIdx}')" class="w-full sm:w-auto bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold px-5 py-2 rounded-lg transition-colors whitespace-nowrap shadow-sm border border-indigo-200">+ 新增給目前點餐人</button>
                            </div>
                        </div>
                        <div id="badges-${uk}" class="mt-3 flex flex-wrap gap-2 empty:hidden"></div>
                    </div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
            data.forEach((cat, cIdx) => cat.items.forEach((_, iIdx) => renderBadges(cIdx, iIdx)));
            document.getElementById('date-count').innerText = `本日 ${getTodayOrders().length} 筆點單`;
        }

        function addOrder(catIdx, itemIdx) {
            const selectEl = document.getElementById('global-person');
            const personName = selectEl.value;
            if (!personName) {
                showToastMsg('請先在右上角選擇「目前點餐人」！', false);
                selectEl.focus();
                selectEl.parentElement.classList.add('animate-bounce');
                setTimeout(() => selectEl.parentElement.classList.remove('animate-bounce'), 1000);
                return;
            }
            const item = restaurantsData[currentRestaurant][catIdx].items[itemIdx];
            getTodayOrders().push({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                itemName: item.name, price: item.price, person: personName,
                restaurant: currentRestaurant, catIdx, itemIdx
            });
            saveState();
            renderBadges(catIdx, itemIdx);
            updateTotal();
            document.getElementById('date-count').innerText = `本日 ${getTodayOrders().length} 筆點單`;
            showToastMsg(`已幫 ${personName} 記上 ${item.name}`);
        }

        function removeOrder(orderId, catIdx, itemIdx) {
            state.orders[currentDate] = getTodayOrders().filter(o => o.id !== orderId);
            saveState();
            renderBadges(catIdx, itemIdx);
            updateTotal();
            document.getElementById('date-count').innerText = `本日 ${getTodayOrders().length} 筆點單`;
        }

        function renderBadges(catIdx, itemIdx) {
            const box = document.getElementById(`badges-${catIdx}-${itemIdx}`);
            if (!box) return;
            const item = restaurantsData[currentRestaurant][catIdx].items[itemIdx];
            const related = getTodayOrders().filter(o => o.itemName === item.name && o.restaurant === currentRestaurant);
            box.innerHTML = related.map(order => `
                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium bg-indigo-50 text-indigo-700 border border-indigo-200">
                    ${order.person}
                    <button onclick="removeOrder('${order.id}','${catIdx}','${itemIdx}')" class="text-indigo-400 hover:text-indigo-900 focus:outline-none bg-indigo-100 rounded-full p-0.5 ml-1">
                        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </span>`).join('');
        }

        function updateTotal() {
            const total = getTodayOrders().reduce((s, o) => s + o.price, 0);
            document.getElementById('total-price').innerText = `$${total.toLocaleString()}`;
            document.getElementById('cart-count').innerText = getTodayOrders().length;
            const btn = document.getElementById('cart-count').parentElement;
            btn.classList.add('scale-105');
            setTimeout(() => btn.classList.remove('scale-105'), 200);
        }

        /* ============ 後台：人員 ============ */
        function toggleAdmin() {
            const p = document.getElementById('admin-panel');
            p.classList.toggle('hidden');
            document.getElementById('admin-arrow').innerText = p.classList.contains('hidden') ? '▼' : '▲';
            if (!p.classList.contains('hidden')) {
                renderPeopleManageList();
                if (!document.getElementById('export-month').value) {
                    document.getElementById('export-month').value = currentDate.slice(0, 7);
                }
            }
        }
        function renderPeopleManageList() {
            document.getElementById('people-manage-list').innerHTML = state.people.map((p, i) => `
                <span class="inline-flex items-center gap-1 bg-gray-100 border border-gray-200 rounded-full pl-3 pr-1 py-1 text-sm">
                    <span class="cursor-pointer hover:text-indigo-600 font-medium" onclick="renamePerson(${i})" title="點擊改名">${p}</span>
                    <button onclick="deletePerson(${i})" title="刪除" class="text-red-400 hover:text-white hover:bg-red-500 bg-white rounded-full w-5 h-5 leading-none flex items-center justify-center transition-colors">×</button>
                </span>`).join('');
        }
        function addPerson() {
            const input = document.getElementById('new-person-input');
            const name = input.value.trim();
            if (!name) return showToastMsg('請輸入姓名', false);
            if (state.people.includes(name)) return showToastMsg('該姓名已存在', false);
            state.people.push(name);
            input.value = '';
            saveState();
            renderPeopleManageList();
            refreshPeopleSelect();
            showToastMsg(`已新增 ${name}`);
        }
        function deletePerson(i) {
            const name = state.people[i];
            let cnt = 0;
            Object.values(state.orders).forEach(list => cnt += list.filter(o => o.person === name).length);
            if (cnt > 0 && !confirm(`${name} 在所有日期共有 ${cnt} 筆點單，刪除會一併移除，確定？`)) return;
            Object.keys(state.orders).forEach(d => {
                state.orders[d] = state.orders[d].filter(o => o.person !== name);
            });
            state.people.splice(i, 1);
            saveState();
            renderPeopleManageList();
            refreshPeopleSelect();
            renderMenu();
            updateTotal();
            showToastMsg(`已刪除 ${name}`);
        }
        function renamePerson(i) {
            const oldName = state.people[i];
            const newName = prompt('改名為：', oldName);
            if (newName === null) return;
            const t = newName.trim();
            if (!t) return showToastMsg('姓名不可空白', false);
            if (t !== oldName && state.people.includes(t)) return showToastMsg('該姓名已存在', false);
            state.people[i] = t;
            Object.values(state.orders).forEach(list => list.forEach(o => { if (o.person === oldName) o.person = t; }));
            saveState();
            renderPeopleManageList();
            refreshPeopleSelect();
            renderMenu();
            showToastMsg(`已改名為 ${t}`);
        }

        /* ============ 後台：菜單轉文字 ============ */
        function generateMenuText() {
            let txt = `【${currentRestaurant} 菜單】\n\n`;
            restaurantsData[currentRestaurant].forEach(cat => {
                txt += `■ ${cat.category}\n`;
                cat.items.forEach(it => txt += `  ${it.name} $${it.price}${it.desc ? `（${it.desc}）` : ''}\n`);
                txt += '\n';
            });
            document.getElementById('menu-text-output').value = txt.trimEnd();
        }
        function copyMenuText() {
            const ta = document.getElementById('menu-text-output');
            if (!ta.value) return showToastMsg('請先按「產生文字」', false);
            ta.select();
            try { document.execCommand('copy'); showToastMsg('✅ 菜單文字已複製'); }
            catch (e) { showToastMsg('複製失敗，請手動選取', false); }
            window.getSelection().removeAllRanges();
        }

        /* ============ 日結明細 Modal ============ */
        function openSummaryModal() {
            if (getTodayOrders().length === 0) return showToastMsg('本日還沒有點任何餐點喔！', false);
            document.getElementById('summary-restaurant-name').innerText = currentRestaurant;
            document.getElementById('summary-date').innerText = currentDate;
            document.getElementById('summary-modal').classList.remove('hidden');
            document.getElementById('summary-modal').classList.add('flex');
            const total = getTodayOrders().reduce((s, o) => s + o.price, 0);
            document.getElementById('summary-total-price').innerText = `$${total.toLocaleString()}`;
            renderSummaryContent();
        }
        function closeSummaryModal() {
            document.getElementById('summary-modal').classList.add('hidden');
            document.getElementById('summary-modal').classList.remove('flex');
        }
        function switchSummaryTab(view) {
            currentSummaryView = view;
            const bi = document.getElementById('tab-btn-item'), bp = document.getElementById('tab-btn-person');
            const on = "flex-1 py-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 transition-colors";
            const off = "flex-1 py-3 text-center font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-colors";
            if (view === 'item') { bi.className = on; bp.className = off; } else { bp.className = on; bi.className = off; }
            renderSummaryContent();
        }
        function renderSummaryContent() {
            const container = document.getElementById('summary-content');
            const todays = getTodayOrders();
            let html = '';
            currentSummaryText = `【${currentRestaurant} 日結明細 ${currentDate}】\n\n`;

            if (currentSummaryView === 'item') {
                const itemCounts = {};
                todays.forEach(o => {
                    if (!itemCounts[o.itemName]) itemCounts[o.itemName] = { count: 0, price: o.price, people: [] };
                    itemCounts[o.itemName].count++;
                    itemCounts[o.itemName].people.push(o.person);
                });
                html += '<div class="space-y-3">';
                Object.keys(itemCounts).sort().forEach(name => {
                    const d = itemCounts[name];
                    html += `<div class="bg-white p-3 rounded shadow-sm border border-gray-100 flex justify-between items-center">
                        <div><span class="font-bold text-lg text-gray-800">${name}</span>
                        <span class="ml-2 px-2 py-0.5 bg-orange-100 text-orange-700 text-sm font-bold rounded">x${d.count}</span>
                        <div class="text-sm text-gray-500 mt-1">人員: ${d.people.join(', ')}</div></div>
                        <div class="font-bold text-indigo-600 text-lg">$${d.price * d.count}</div></div>`;
                    currentSummaryText += `- ${name} x${d.count} ($${d.price * d.count})\n`;
                });
                html += '</div>';
            } else {
                const po = {};
                state.people.forEach(p => po[p] = { total: 0, items: [] });
                todays.forEach(o => {
                    if (!po[o.person]) po[o.person] = { total: 0, items: [] };
                    po[o.person].items.push(o); po[o.person].total += o.price;
                });
                html += `<div class="overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm">
                    <table class="min-w-full text-sm text-left whitespace-nowrap"><thead class="bg-gray-100 text-gray-700 border-b border-gray-200"><tr>
                    <th class="px-4 py-3 font-bold">姓名</th><th class="px-4 py-3 font-bold w-full">餐點明細</th>
                    <th class="px-4 py-3 font-bold text-right">總計</th><th class="px-4 py-3 font-bold text-right text-red-600">自付</th>
                    <th class="px-4 py-3 font-bold text-right text-green-700">公司餐費</th></tr></thead><tbody class="divide-y divide-gray-100">`;
                let sumTotal = 0, sumSelf = 0, sumCompany = 0;
                state.people.forEach(person => {
                    const d = po[person];
                    if (d.items.length === 0) {
                        html += `<tr class="hover:bg-gray-50 text-gray-400"><td class="px-4 py-2 font-medium text-gray-600">${person}</td>
                            <td class="px-4 py-2">PASS</td><td class="px-4 py-2 text-right">-</td><td class="px-4 py-2 text-right">-</td><td class="px-4 py-2 text-right">-</td></tr>`;
                        currentSummaryText += `👤 ${person} : PASS\n`;
                    } else {
                        const { selfPay, companyPays } = calculatePayment(person, d.total);
                        const detail = d.items.map(i => `${i.itemName}$${i.price}`).join(' + ');
                        sumTotal += d.total; sumSelf += selfPay; sumCompany += companyPays;
                        html += `<tr class="hover:bg-gray-50"><td class="px-4 py-2 font-bold text-gray-800">${person}</td>
                            <td class="px-4 py-2 text-gray-700 whitespace-normal min-w-[200px]">${detail}</td>
                            <td class="px-4 py-2 text-right font-bold text-gray-800">$${d.total}</td>
                            <td class="px-4 py-2 text-right font-bold ${selfPay > 0 ? 'text-red-500' : 'text-gray-400'}">$${selfPay}</td>
                            <td class="px-4 py-2 text-right font-bold text-green-600">$${companyPays}</td></tr>`;
                        currentSummaryText += `👤 ${person} (自付$${selfPay} / 公司$${companyPays})\n   ↳ ${detail} = $${d.total}\n`;
                    }
                });
                html += `<tr class="bg-indigo-50 font-bold"><td class="px-4 py-3" colspan="2">合計</td>
                    <td class="px-4 py-3 text-right text-gray-800">$${sumTotal}</td>
                    <td class="px-4 py-3 text-right text-red-600">$${sumSelf}</td>
                    <td class="px-4 py-3 text-right text-green-700">$${sumCompany}</td></tr>`;
                html += '</tbody></table></div>';
                currentSummaryText += `\n合計：總額$${sumTotal} / 自付$${sumSelf} / 公司$${sumCompany}\n`;
            }
            const total = todays.reduce((s, o) => s + o.price, 0);
            currentSummaryText += `\n總數量: ${todays.length} 份 / 總金額: $${total.toLocaleString()}`;
            container.innerHTML = html;
        }
        function copySummary() {
            try {
                const ta = document.createElement('textarea');
                ta.value = currentSummaryText; ta.style.position = 'fixed'; ta.style.opacity = 0;
                document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                showToastMsg('✅ 明細已複製到剪貼簿！');
            } catch (e) { showToastMsg('複製失敗，請手動選取文字', false); }
        }

        /* ============ CSV 工具 ============ */
        function downloadCSV(csvContent, filename) {
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.style.visibility = 'hidden';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
        function csvCell(v) {
            const s = String(v == null ? '' : v);
            return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        }

        // 本日日結表 CSV（Image 3 精簡版）
        function exportDayCSV() {
            const todays = getTodayOrders();
            if (todays.length === 0) return showToastMsg('本日沒有點單可匯出', false);
            let csv = `${currentDate} 日結會計表（${currentRestaurant}）\n`;
            csv += "序號,姓名,餐點明細,總額,自付,公司餐費\n";
            const po = {}; state.people.forEach(p => po[p] = { total: 0, items: [] });
            todays.forEach(o => { if (!po[o.person]) po[o.person] = { total: 0, items: [] }; po[o.person].items.push(o); po[o.person].total += o.price; });
            let idx = 1, gt = 0, gs = 0, gc = 0;
            state.people.forEach(person => {
                const d = po[person];
                if (d.items.length === 0) { csv += `${idx},${csvCell(person)},PASS,0,0,0\n`; }
                else {
                    const { selfPay, companyPays } = calculatePayment(person, d.total);
                    const detail = d.items.map(i => `${i.itemName}$${i.price}`).join('+');
                    csv += `${idx},${csvCell(person)},${csvCell(detail)},${d.total},${selfPay},${companyPays}\n`;
                    gt += d.total; gs += selfPay; gc += companyPays;
                }
                idx++;
            });
            csv += `,,合計,${gt},${gs},${gc}\n`;
            downloadCSV(csv, `日結表_${currentDate}_${currentRestaurant}.csv`);
            showToastMsg('✅ 已下載本日日結表');
        }

        /* ============ 月結：核心運算 ============ */
        // 回傳某月每人每日的三種金額
        function computeMonth(ym) { // ym = "2026-07"
            const [y, m] = ym.split('-').map(Number);
            const daysInMonth = new Date(y, m, 0).getDate();
            const people = state.people;
            // matrix[person][day] = {total, self, company, detail, restaurant}
            const matrix = {};
            people.forEach(p => matrix[p] = {});
            for (let day = 1; day <= daysInMonth; day++) {
                const ds = `${ym}-${String(day).padStart(2, '0')}`;
                const list = state.orders[ds] || [];
                if (list.length === 0) continue;
                const po = {};
                list.forEach(o => { if (!po[o.person]) po[o.person] = { total: 0, items: [], restaurant: o.restaurant }; po[o.person].total += o.price; po[o.person].items.push(o); });
                Object.keys(po).forEach(person => {
                    const d = po[person];
                    const { selfPay, companyPays } = calculatePayment(person, d.total);
                    if (!matrix[person]) matrix[person] = {};
                    matrix[person][day] = {
                        total: d.total, self: selfPay, company: companyPays,
                        detail: d.items.map(i => `${i.itemName}$${i.price}`).join('+'),
                        restaurant: d.restaurant
                    };
                });
            }
            return { y, m, daysInMonth, people, matrix };
        }

        // 月報表網格 CSV（Image 2 格式）：三張表
        function exportMonthlyGrid() {
            const ym = document.getElementById('export-month').value;
            if (!ym) return showToastMsg('請先選擇月份', false);
            const { y, m, daysInMonth, people, matrix } = computeMonth(ym);
            const fields = [['total', '餐點總額'], ['company', '公司餐費'], ['self', '員工自付']];
            let csv = '';
            fields.forEach(([key, label]) => {
                csv += `${y}年${m}月 ${label}表（見紅就休；H=放假）\n`;
                let header = '姓名';
                for (let d = 1; d <= daysInMonth; d++) header += `,${d}`;
                header += ',合計';
                csv += header + '\n';
                people.forEach(person => {
                    let row = csvCell(person);
                    let sum = 0;
                    for (let d = 1; d <= daysInMonth; d++) {
                        const ds = `${ym}-${String(d).padStart(2, '0')}`;
                        const hol = isHoliday(ds);
                        const cell = matrix[person] && matrix[person][d];
                        if (cell) { row += `,${cell[key]}`; sum += cell[key]; }
                        else if (hol.holiday) { row += ',H'; }
                        else { row += ','; }
                    }
                    row += `,${sum}`;
                    csv += row + '\n';
                });
                // 每日總計列
                let totalRow = '每日總計';
                let grand = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    let dayTotal = 0;
                    people.forEach(person => { const c = matrix[person] && matrix[person][d]; if (c) dayTotal += c[key]; });
                    totalRow += `,${dayTotal || ''}`;
                    grand += dayTotal;
                }
                totalRow += `,${grand}`;
                csv += totalRow + '\n\n';
            });
            downloadCSV(csv, `月報表網格_${ym}.csv`);
            showToastMsg('✅ 已下載月報表網格（三張表）');
        }

        // 整月日結表 CSV：每天一區塊，逐人列出明細
        function exportMonthlyDaily() {
            const ym = document.getElementById('export-month').value;
            if (!ym) return showToastMsg('請先選擇月份', false);
            const { daysInMonth } = computeMonth(ym);
            const wdMap = ['日','一','二','三','四','五','六'];
            let csv = `${ym} 整月日結會計表\n\n`;
            let monthTotal = 0, monthSelf = 0, monthCompany = 0;
            for (let day = 1; day <= daysInMonth; day++) {
                const ds = `${ym}-${String(day).padStart(2, '0')}`;
                const list = state.orders[ds] || [];
                const hol = isHoliday(ds);
                const wd = wdMap[new Date(ds + 'T00:00:00').getDay()];
                if (list.length === 0) {
                    if (hol.holiday) csv += `${ds}（週${wd}）,${hol.name} 放假\n\n`;
                    continue;
                }
                const restaurant = list[0].restaurant;
                csv += `${ds}（週${wd}）${hol.holiday ? '【' + hol.name + '】' : ''} 餐廳：${restaurant}\n`;
                csv += "序號,姓名,餐點明細,總額,自付,公司餐費\n";
                const po = {};
                list.forEach(o => { if (!po[o.person]) po[o.person] = { total: 0, items: [] }; po[o.person].total += o.price; po[o.person].items.push(o); });
                let idx = 1, dt = 0, dsf = 0, dc = 0;
                Object.keys(po).forEach(person => {
                    const d = po[person];
                    const { selfPay, companyPays } = calculatePayment(person, d.total);
                    const detail = d.items.map(i => `${i.itemName}$${i.price}`).join('+');
                    csv += `${idx},${csvCell(person)},${csvCell(detail)},${d.total},${selfPay},${companyPays}\n`;
                    dt += d.total; dsf += selfPay; dc += companyPays; idx++;
                });
                csv += `,,當日合計,${dt},${dsf},${dc}\n\n`;
                monthTotal += dt; monthSelf += dsf; monthCompany += dc;
            }
            csv += `====== 全月合計 ======\n,,總額,${monthTotal}\n,,自付,${monthSelf}\n,,公司餐費,${monthCompany}\n`;
            downloadCSV(csv, `整月日結表_${ym}.csv`);
            showToastMsg('✅ 已下載整月日結表');
        }

        function previewMonth() {
            const ym = document.getElementById('export-month').value;
            if (!ym) return showToastMsg('請先選擇月份', false);
            const { y, m, daysInMonth, people, matrix } = computeMonth(ym);
            let daysWithData = 0, monthCompany = 0, monthSelf = 0, monthTotal = 0;
            for (let d = 1; d <= daysInMonth; d++) {
                let has = false;
                people.forEach(p => { const c = matrix[p] && matrix[p][d]; if (c) { has = true; monthTotal += c.total; monthSelf += c.self; monthCompany += c.company; } });
                if (has) daysWithData++;
            }
            const box = document.getElementById('month-preview');
            box.innerHTML = `<div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
                <p class="font-bold text-indigo-800 mb-1">${y}年${m}月 概況</p>
                <p class="text-gray-700">有點餐天數：<b>${daysWithData}</b> 天</p>
                <p class="text-gray-700">全月餐點總額：<b>$${monthTotal.toLocaleString()}</b></p>
                <p class="text-green-700">公司餐費合計：<b>$${monthCompany.toLocaleString()}</b></p>
                <p class="text-red-600">員工自付合計：<b>$${monthSelf.toLocaleString()}</b></p>
            </div>`;
        }

        /* ============ 備份 / 還原 ============ */
        function exportBackup() {
            const data = JSON.stringify(state, null, 2);
            const blob = new Blob([data], { type: 'application/json;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `團購資料備份_${toDateStr(new Date())}.json`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            showToastMsg('✅ 已匯出備份 JSON');
        }
        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!parsed.people || !parsed.orders) throw new Error('格式錯誤');
                    if (!confirm('匯入將覆蓋目前所有資料，確定？（建議先匯出目前備份）')) return;
                    state = parsed;
                    saveState();
                    initTabs(); renderMenu(); updateTotal(); renderPeopleManageList();
                    showToastMsg('✅ 已還原備份資料');
                } catch (err) { showToastMsg('匯入失敗：檔案格式不正確', false); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        function clearMonthConfirm() {
            const ym = document.getElementById('export-month').value || currentDate.slice(0, 7);
            const cnt = Object.keys(state.orders).filter(d => d.startsWith(ym)).reduce((s, d) => s + state.orders[d].length, 0);
            if (cnt === 0) return showToastMsg(`${ym} 沒有資料`, false);
            if (!confirm(`確定清空 ${ym} 全月共 ${cnt} 筆點單？此動作無法復原（建議先備份）`)) return;
            Object.keys(state.orders).forEach(d => { if (d.startsWith(ym)) delete state.orders[d]; });
            saveState();
            renderMenu(); updateTotal();
            showToastMsg(`✅ 已清空 ${ym} 資料`);
        }

        /* ============ 初始化 ============ */
        document.getElementById('summary-modal').addEventListener('click', function (e) { if (e.target === this) closeSummaryModal(); });
        document.getElementById('work-date').addEventListener('change', onDateChange);

        window.onload = () => {
            loadState();
            document.getElementById('work-date').value = currentDate;
            renderDateBadge();
            initTabs();
            renderMenu();
            updateTotal();
        };
    </script>
</body>
